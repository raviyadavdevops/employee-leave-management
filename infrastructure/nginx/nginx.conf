events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:8000;
    }

    upstream user_service {
        server user-service:8001;
    }

    upstream leave_service {
        server leave-service:8002;
    }

    upstream notification_service {
        server notification-service:8003;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 80;
        server_name _;
        absolute_redirect off;

        # Increase buffer sizes for larger request bodies
        client_max_body_size 10M;
        client_body_buffer_size 128k;

        # Proxy settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth Service routes
        location /api/v1/auth/ {
            proxy_pass http://auth_service/api/v1/auth/;
        }

        # User Service routes
        location /api/v1/users/ {
            proxy_pass http://user_service/api/v1/users/;
        }

        # Proxy without URI rewrite to preserve both slash/no-slash variants
        location /api/v1/employees {
            proxy_pass http://user_service;
        }

        # Leave Service routes
        location /api/v1/leaves/ {
            proxy_pass http://leave_service/api/v1/leaves/;
        }

        # Proxy without URI rewrite to preserve both slash/no-slash variants
        location /api/v1/leave-requests {
            proxy_pass http://leave_service;
        }

        location /api/v1/leave-balances/ {
            proxy_pass http://leave_service/api/v1/leave-balances/;
        }

        # Notification Service routes
        location /api/v1/notifications {
            proxy_pass http://notification_service;
        }

        # Health checks
        location /api/v1/auth/health {
            proxy_pass http://auth_service/health;
        }

        location /api/v1/users/health {
            proxy_pass http://user_service/health;
        }

        location /api/v1/leaves/health {
            proxy_pass http://leave_service/health;
        }

        location /api/v1/notifications/health {
            proxy_pass http://notification_service/health;
        }

        # Root endpoint
        location / {
            return 200 '{"status":"ok","message":"Employee Leave Management API Gateway","version":"1.0.0"}';
            add_header Content-Type application/json;
        }

        # 404 for undefined routes
        location @404 {
            return 404 '{"error":"Not Found","message":"The requested resource does not exist"}';
            add_header Content-Type application/json;
        }
    }
}
