# RabbitMQ Configuration for Employee Leave Management System

# Logging
log.console = true
log.console.level = info
log.file = false

# Network and Protocol Configuration
listeners.tcp.default = 5672
management.tcp.port = 15672

# Virtual Host Configuration
# Default vhost is "/" - sufficient for development
# In production, consider creating a dedicated vhost

# Memory and Disk Limits
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 1.0

# Connection Settings
channel_max = 2048
heartbeat = 60

# Consumer Timeout (30 minutes for long-running notification processing)
consumer_timeout = 1800000

# Queue Settings
# Messages will be persisted to disk
queue_master_locator = min-masters

# Management Plugin (enabled by default in management image)
# management.load_definitions = /etc/rabbitmq/definitions.json

# Clustering (disabled for single-node setup)
# cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
